<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - NeuroReads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .admin-access-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .admin-icon {
            font-size: 4rem;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .btn-admin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
    <div class="admin-access-container">
        <div class="admin-card">
            <div class="admin-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h2 class="mb-3">Admin Access</h2>
            
            {% if user.is_admin %}
            <p class="text-success mb-4">
                <i class="bi bi-check-circle-fill"></i> You have administrator privileges
            </p>
            <div class="d-grid gap-2">
                <a href="{% url 'admin_dashboard' %}" class="btn btn-admin">
                    <i class="bi bi-speedometer2"></i> Go to Admin Dashboard
                </a>
                <a href="{% url 'user_home' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-house"></i> Back to User Home
                </a>
            </div>
            {% else %}
            <p class="text-danger mb-4">
                <i class="bi bi-exclamation-triangle-fill"></i> Administrator privileges required
            </p>
            <div class="alert alert-warning">
                <p class="mb-0">You need administrator privileges to access the admin panel.</p>
            </div>
            <div class="d-grid gap-2">
                <a href="{% url 'user_home' %}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Back to User Home
                </a>
            </div>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
