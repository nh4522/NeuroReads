{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NeuroReads</title>
  <!-- FIXED: Django static paths -->
  <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
  <script defer src="{% static 'myapp/js/script.js' %}"></script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <!-- Added logo/branding for consistency -->
      <div class="auth-header">
        <h1 class="auth-logo">NeuroReads</h1>
        <h2>Create Account</h2>
        <p class="subtitle">Join the NeuroReads community</p>
      </div>

      <!-- FIXED: Added CSRF token and method -->
      <form method="post" id="registerForm">
        {% csrf_token %}
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="full_name" placeholder="Enter your name" required>
        </div>

        <!-- NEW: Username Field -->
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
          <div class="username-feedback" id="usernameFeedback" style="display: none;"></div>
        </div>

        <div class="input-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" name="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group password-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" name="password" placeholder="Create a password" required>
          <span class="toggle-password" data-target="registerPassword">👁️</span>
          <!-- Password strength indicator -->
          <div class="password-strength">
            <div class="strength-bar"></div>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="input-group password-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter your password" required>
          <span class="toggle-password" data-target="confirmPassword">👁️</span>
        </div>

        <!-- Terms and Conditions -->
        <div class="remember-me">
          <input type="checkbox" id="agreeTerms" name="agree_terms" required>
          <label for="agreeTerms">I agree to the <a href="#" style="color: #ffd27f;">Terms & Conditions</a></label>
        </div>

        <button type="submit" class="btn-primary">
          <span class="btn-text">Create Account</span>
          <span class="btn-loading" style="display: none;">Creating Account...</span>
        </button>

        <!-- Error message container -->
        <div class="error-message" style="display: none;"></div>
      </form>

      <!-- Social login options -->
      <div class="social-login">
        <div class="divider">
          <span>Or sign up with</span>
        </div>
        <div class="social-buttons">
          <button type="button" class="social-btn google-btn">
            <img src="{% static 'myapp/icons/google.png' %}" alt="Google" class="social-icon">
            <span>Google</span>
          </button>
          <button type="button" class="social-btn facebook-btn">
            <img src="{% static 'myapp/icons/facebook.png' %}" alt="Facebook" class="social-icon">
            <span>Facebook</span>
          </button>
        </div>
      </div>

      <!-- FIXED: Django URLs -->
      <p class="footer-text">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
    </div>
  </div>
</body>
</html>
